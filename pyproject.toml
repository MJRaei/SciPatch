[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "motel"
version = "0.1.0"
description = "Turn research repositories into tools that any AI agent can find, run, and remember."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Javad Raei" }]
keywords = ["mcp", "agent-skills", "ai-agents", "materials-science", "chemistry", "scientific-computing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=2.3,<3",
    "pydantic>=2.7,<3",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.12",
]

[project.scripts]
motel = "motel.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",  # Starlette's TestClient (dashboard tests)
    "mypy>=1.11",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[tool.uv]
# Rebuild when any source file changes, not only pyproject.toml, so reinstalling
# from a checkout (./install.sh, `uv tool install .`) never reuses a stale build.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*" }]

[tool.hatch.build.targets.wheel]
packages = ["src/motel"]

[tool.hatch.build.targets.sdist]
include = ["src/motel", "tests", "docs", "README.md", "LICENSE", "CHANGELOG.md"]

# ---------------------------------------------------------------- linting ---

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "PTH",      # prefer pathlib
    "S",        # bandit (security)
    "N",        # naming
]
ignore = [
    "SIM905",   # "a b c".split() reads better than a long list literal for word lists
    "S603",     # subprocess without shell: we always pass argument lists
    "S607",     # partial executable paths (git, uv) are resolved deliberately
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108"]
# The shim runs inside tool environments on Python 3.8+, so it keeps old idioms.
"src/motel/runtime/shim.py" = ["UP", "PTH", "S110", "S112"]
"src/motel/catalog/**" = ["UP", "PTH", "N"]
# Tool packages follow the conventions of the scientific code they wrap (α, μ in docstrings).
"tools/**" = ["PTH", "N", "RUF002"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------- typing ----

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
packages = ["motel"]
mypy_path = "src"
exclude = ["src/motel/catalog/", "src/motel/assets/"]

# ---------------------------------------------------------------- tests -----

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "integration: builds real environments with uv (slower; needs uv on PATH)",
]
filterwarnings = ["error::DeprecationWarning:motel.*"]

[tool.coverage.run]
source = ["motel"]
omit = ["src/motel/catalog/*"]
