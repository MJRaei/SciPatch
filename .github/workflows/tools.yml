name: Tools

# Rebuild tool packages from scratch and run their golden tests on Linux, macOS,
# and Windows (where each tool's motel.lock says it can be installed): on every
# change to a tool, and weekly for all tools, to catch upstream breakage early.
on:
  pull_request:
    paths: ["tools/**"]
  push:
    branches: [main]
    paths: ["tools/**"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  select:
    name: Select tools
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: list
        run: |
          case "${{ github.event_name }}" in
            pull_request) changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD -- tools) ;;
            push) changed=$(git diff --name-only "${{ github.event.before }}" HEAD -- tools) ;;
            *) changed=$(ls tools/*/motel.yaml) ;;
          esac
          tools=$(echo "$changed" | cut -d/ -f2 | sort -u | while read -r t; do
            [ -n "$t" ] && [ -f "tools/$t/motel.yaml" ] && echo "$t"; done)
          echo "matrix=$(python3 .github/scripts/tool_matrix.py $tools)" >> "$GITHUB_OUTPUT"

  check:
    name: ${{ matrix.tool }} (${{ matrix.os }}${{ matrix.wsl && ', WSL' || '' }})
    needs: select
    if: needs.select.outputs.matrix != '{"include": []}'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # conda tools need no setup: Motel downloads its own micromamba.
      # Tools without Windows builds run inside WSL on Windows, as for users.
      - if: matrix.wsl
        uses: Vampire/setup-wsl@v7.0.0
        with:
          distribution: Ubuntu-24.04
      - run: uv tool install --python 3.12 .
      - name: Build from scratch and run golden tests
        run: motel check tools/${{ matrix.tool }} --clean
        env:
          # Golden tests that need a secret are skipped when it is not configured.
          MP_API_KEY: ${{ secrets.MP_API_KEY }}
