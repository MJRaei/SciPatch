schema: 1
name: mace
version: 0.1.0
title: MACE foundation potentials (MACE-MP and MACE-OFF)
summary: >-
  Energies, forces, stresses, structure relaxation, and molecular dynamics with
  the MACE machine-learned foundation potentials: MACE-MP for inorganic
  materials across 89 elements, and MACE-OFF for organic molecules.
domains: [materials, chemistry]
tags: [ml-potential, universal-potential, foundation-model, interatomic-potential, relaxation,
       energy, forces, stress, molecular-dynamics, md, organic-molecules, mace]

source:
  repo: "https://github.com/ACEsuit/mace"
  ref: "4d2da09413ac1407f37cdbb6b81fa28e4c15655e"   # tag v0.3.16
  install: true
  paper: "https://doi.org/10.48550/arXiv.2401.00096"
  citation: >-
    I. Batatia et al., "A foundation model for atomistic materials chemistry",
    arXiv:2401.00096 (MACE-MP); D. P. Kovács et al., "MACE-OFF: Short-Range
    Transferable Machine Learning Force Fields for Organic Molecules",
    J. Am. Chem. Soc. (2025) (MACE-OFF); I. Batatia, D. P. Kovács, G. N. C.
    Simm, C. Ortner, G. Csányi, "MACE: Higher Order Equivariant Message Passing
    Neural Networks for Fast and Accurate Force Fields", NeurIPS 2022.
  license: MIT (code and MACE-MP models); Academic Software License, non-commercial (MACE-OFF models)

environment:
  manager: uv
  python: "3.12"
  packages: []
  post_install:
    # Download the default models now, so the first run works offline.
    - python -c "from mace.calculators.foundations_models import download_mace_mp_checkpoint as d; d('medium-mpa-0'); d('medium')"
    - python -c "from mace.calculators import mace_off; mace_off(model='small', device='cpu')"

entrypoint: api

functions:
  predict:
    params:
      structure: {kind: structure}
    outputs:
      energy_ev_per_atom: {unit: eV/atom}
      forces_ev_per_angstrom: {unit: eV/Å}
      stress_gpa: {unit: GPa}
  relax:
    params:
      structure: {kind: structure}
      fmax: {unit: eV/Å}
    outputs:
      final_energy_ev: {unit: eV}
      relaxed_structure: {kind: structure}
  molecular_dynamics:
    long_running: true
    params:
      structure: {kind: structure}
      temperature_k: {unit: K}
      timestep_fs: {unit: fs}
    outputs:
      trajectory: {kind: trajectory}

validity: >-
  MACE-MP models are trained on DFT (PBE/PBE+U) data from the Materials Project
  (MPA-0 also on Alexandria): their energies are comparable with MP-compatible
  PBE data only, they inherit PBE's errors (lattice constants typically ~0.5-1%
  too large, band-gap-related properties are not predicted), and they are most
  reliable near equilibrium for chemistries well represented in the training
  data. MACE-OFF models cover organic molecules made of H, C, N, O, F, P, S, Cl,
  Br, I (no metals or charged species) at the ωB97M-D3(BJ) level, and are
  licensed for non-commercial use only (Academic Software License). Results from
  different models are not interchangeable; state the model used. Confirm
  critical conclusions with DFT.

golden:
  - name: MACE-OFF23 water energy matches the MACE test suite
    function: predict
    args: {structure: tests/data/water.extxyz, model: off23-small}
    expect:
      energy_ev: {approx: -2081.116128586803, abs: 0.000001}
    reference: >-
      mace v0.3.16, tests/test_calculator.py::test_mace_off: ASE's H2O molecule
      with MACE-OFF23 small (float64) has an energy of -2081.116128586803 eV.
  - name: silicon lattice constant within 1.5% of experiment (MACE-MPA-0)
    function: relax
    args: {structure: tests/data/Si_diamond.cif, fmax: 0.005}
    expect:
      converged: true
      lattice.a_angstrom: {approx: 5.431, rel: 0.015}
    reference: >-
      Silicon lattice parameter 5.431020511 Å (CODATA 2018, 22.5 °C). PBE-trained
      models typically overestimate it by about 0.5-1%; MACE-MPA-0 gives 5.467 Å.
  - name: aluminum lattice constant within 1.5% of experiment (MACE-MP-0)
    function: relax
    args: {structure: tests/data/Al_fcc.cif, fmax: 0.005, model: mp-0-medium}
    expect:
      converged: true
      lattice.a_angstrom: {approx: 4.05, rel: 0.015}
    reference: >-
      Experimental room-temperature lattice constant of aluminum, about 4.05 Å;
      MACE-MP-0 medium (the model of the MACE-MP paper) gives 4.061 Å.
