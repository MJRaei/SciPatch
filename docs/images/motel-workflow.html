<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motel workflow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  @page { size: 1800px 660px; margin: 0; }
  * { margin: 0; padding: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  html, body { background: #ffffff; }
  svg { display: block; }
  text { font-family: Inter, "Helvetica Neue", Arial, sans-serif; }
  .mono { font-family: "JetBrains Mono", Menlo, monospace; }
  @media print { .sh { filter: none; } }
</style>
</head>
<body>
<svg width="1800" height="660" viewBox="0 0 1800 660" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="a-indigo" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4f46e5"/></marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker>
    <marker id="a-sky" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0284c7"/></marker>
    <marker id="a-rose" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e11d48"/></marker>

    <!-- icons: 24x24, stroked with the current colour -->
    <symbol id="i-code" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></symbol>
    <symbol id="i-bot" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></symbol>
    <symbol id="i-atom" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1.2"/><path d="M20.2 20.2c2.04-2.03.02-7.36-4.5-11.9-4.54-4.52-9.87-6.54-11.9-4.5-2.04 2.03-.02 7.36 4.5 11.9 4.54 4.52 9.87 6.54 11.9 4.5Z"/><path d="M15.7 15.7c4.52-4.54 6.54-9.87 4.5-11.9-2.03-2.04-7.36-.02-11.9 4.5-4.52 4.54-6.54 9.87-4.5 11.9 2.03 2.04 7.36.02 11.9-4.5Z"/></symbol>
    <symbol id="i-molecule" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="7" r="2.5"/><circle cx="18.5" cy="7" r="2.5"/><circle cx="12" cy="18" r="2.5"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="7" y1="9.2" x2="10.7" y2="15.8"/><line x1="17" y1="9.2" x2="13.3" y2="15.8"/></symbol>
    <symbol id="i-cube" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></symbol>
    <symbol id="i-wave" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></symbol>
    <symbol id="i-battery" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="17" height="10" rx="2"/><line x1="22" y1="11" x2="22" y2="13"/><path d="M11.5 9.5 9 12h3l-2.5 2.5"/></symbol>
    <symbol id="i-thermo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/></symbol>
    <symbol id="i-house" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9v12h14V9"/><path d="M10 21v-6h4v6"/></symbol>
    <symbol id="i-plug" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22v-5"/><path d="M9 8V2"/><path d="M15 8V2"/><path d="M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z"/></symbol>
    <symbol id="i-terminal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
    <symbol id="hex" viewBox="-50 -50 100 100"><polygon points="0,-46 39.8,-23 39.8,23 0,46 -39.8,23 -39.8,-23" stroke-linejoin="round"/></symbol>
  </defs>

  <!-- zones -->
  <rect x="10" y="10" width="870" height="640" rx="36" fill="#f1f2ff" stroke="#e0e3fd" stroke-width="2"/>
  <rect x="920" y="10" width="870" height="640" rx="36" fill="#ecf6fc" stroke="#d3e9f6" stroke-width="2"/>
  <circle cx="50" cy="52" r="20" fill="#4f46e5"/>
  <text x="50" y="60" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">1</text>
  <text x="82" y="61" font-size="26" font-weight="800" letter-spacing="3" fill="#4f46e5">BUILD ONCE</text>
  <circle cx="960" cy="52" r="20" fill="#0284c7"/>
  <text x="960" y="60" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">2</text>
  <text x="992" y="61" font-size="26" font-weight="800" letter-spacing="3" fill="#0284c7">USE EVERYWHERE</text>

  <!-- 1. research code -->
  <circle class="sh" cx="135" cy="310" r="66" fill="#fff" stroke="#4f46e5" stroke-width="4" filter="url(#shadow)"/>
  <use href="#i-code" x="107" y="282" width="56" height="56" style="color:#4f46e5"/>
  <circle cx="186" cy="360" r="25" fill="#fff" stroke="#4f46e5" stroke-width="3"/>
  <use href="#i-file" x="173" y="347" width="26" height="26" style="color:#4f46e5"/>
  <text x="135" y="428" text-anchor="middle" font-size="28" font-weight="700" fill="#0b1220">Research code</text>
  <text x="135" y="460" text-anchor="middle" font-size="22" fill="#55657c">+ its paper</text>

  <line x1="212" y1="310" x2="266" y2="310" stroke="#4f46e5" stroke-width="5" stroke-linecap="round" marker-end="url(#a-indigo)"/>

  <!-- 2. coding agent -->
  <circle class="sh" cx="345" cy="310" r="66" fill="#4f46e5" filter="url(#shadow)"/>
  <use href="#i-bot" x="315" y="280" width="60" height="60" style="color:#fff"/>
  <text x="345" y="428" text-anchor="middle" font-size="28" font-weight="700" fill="#0b1220">Coding agent</text>
  <text x="345" y="460" text-anchor="middle" font-size="22" fill="#55657c">wraps it as a tool</text>

  <line x1="422" y1="310" x2="480" y2="310" stroke="#4f46e5" stroke-width="5" stroke-linecap="round" marker-end="url(#a-indigo)"/>

  <!-- 3. golden test gate -->
  <polygon class="sh" points="570,232 648,310 570,388 492,310" fill="#fff" stroke="#059669" stroke-width="4" stroke-linejoin="round" filter="url(#shadow)"/>
  <use href="#i-shield" x="544" y="284" width="52" height="52" style="color:#059669"/>
  <text x="570" y="428" text-anchor="middle" font-size="28" font-weight="700" fill="#0b1220">Matches known</text>
  <text x="570" y="460" text-anchor="middle" font-size="28" font-weight="700" fill="#0b1220">results?</text>

  <!-- no: back to the agent -->
  <path d="M570 226 V182 Q570 168 556 168 H359 Q345 168 345 182 V230" fill="none" stroke="#e11d48" stroke-width="4" stroke-dasharray="10 9" stroke-linecap="round" marker-end="url(#a-rose)"/>
  <circle cx="457" cy="168" r="18" fill="#e11d48"/>
  <use href="#i-x" x="447" y="158" width="20" height="20" style="color:#fff"/>
  <text x="457" y="134" text-anchor="middle" font-size="22" font-weight="700" fill="#e11d48">no: fix and retry</text>

  <!-- example golden test -->
  <rect class="sh" x="430" y="490" width="280" height="140" rx="20" fill="#fff" stroke="#bfe9d6" stroke-width="2" filter="url(#shadow)"/>
  <text x="452" y="526" font-size="21" font-weight="600" fill="#55657c">CO₂ uptake, mmol/g</text>
  <text x="452" y="567" font-size="22" font-weight="700" fill="#0b1220">Tool</text>
  <rect x="512" y="550" width="122" height="22" rx="11" fill="#059669"/>
  <text x="644" y="568" font-size="22" font-weight="700" fill="#0b1220">1.52</text>
  <text x="452" y="609" font-size="22" font-weight="700" fill="#0b1220">Lab</text>
  <rect x="512" y="592" width="118" height="22" rx="11" fill="#94a3b8"/>
  <text x="644" y="610" font-size="22" font-weight="700" fill="#0b1220">1.48</text>

  <!-- yes: into the catalog -->
  <line x1="652" y1="310" x2="740" y2="310" stroke="#059669" stroke-width="5" stroke-linecap="round" marker-end="url(#a-green)"/>
  <circle cx="696" cy="310" r="18" fill="#059669"/>
  <use href="#i-check" x="686" y="300" width="20" height="20" style="color:#fff"/>

  <!-- hub: catalog of verified tools -->
  <circle cx="900" cy="310" r="166" fill="none" stroke="#c7d2fe" stroke-width="2" stroke-dasharray="4 8"/>
  <circle class="sh" cx="900" cy="310" r="150" fill="#fff" stroke="url(#ring)" stroke-width="7" filter="url(#shadow)"/>
  <use href="#hex" x="850" y="260" width="100" height="100" fill="url(#brand)"/>
  <use href="#i-house" x="879" y="289" width="42" height="42" style="color:#fff"/>
  <g stroke-width="3">
    <use href="#hex" x="889.5" y="191.6" width="100" height="100" fill="#f5f3ff" stroke="#c4b5fd"/>
    <use href="#hex" x="929" y="260" width="100" height="100" fill="#ecfeff" stroke="#99e6f2"/>
    <use href="#hex" x="889.5" y="328.4" width="100" height="100" fill="#fdf2f8" stroke="#f5b5d6"/>
    <use href="#hex" x="810.5" y="328.4" width="100" height="100" fill="#f0fdf4" stroke="#a7e3bd"/>
    <use href="#hex" x="771" y="260" width="100" height="100" fill="#fff7ed" stroke="#fdc79a"/>
    <use href="#hex" x="810.5" y="191.6" width="100" height="100" fill="#eff6ff" stroke="#b3cdfb"/>
  </g>
  <use href="#i-atom" x="921.5" y="223.6" width="36" height="36" style="color:#7c3aed"/>
  <use href="#i-molecule" x="961" y="292" width="36" height="36" style="color:#0891b2"/>
  <use href="#i-wave" x="921.5" y="360.4" width="36" height="36" style="color:#db2777"/>
  <use href="#i-battery" x="842.5" y="360.4" width="36" height="36" style="color:#16a34a"/>
  <use href="#i-thermo" x="803" y="292" width="36" height="36" style="color:#ea580c"/>
  <use href="#i-cube" x="842.5" y="223.6" width="36" height="36" style="color:#2563eb"/>
  <rect x="764" y="480" width="272" height="86" rx="22" fill="#fff"/>
  <text x="900" y="516" text-anchor="middle" font-size="30" font-weight="800" fill="#0b1220">50 verified tools</text>
  <text x="900" y="550" text-anchor="middle" font-size="22" fill="#55657c">303 golden tests</text>

  <!-- connection to AI apps -->
  <line x1="1053" y1="310" x2="1126" y2="310" stroke="#0284c7" stroke-width="5" stroke-linecap="round" marker-end="url(#a-sky)"/>
  <circle cx="1088" cy="310" r="24" fill="#fff" stroke="#0284c7" stroke-width="3"/>
  <use href="#i-plug" x="1075" y="297" width="26" height="26" style="color:#0284c7"/>
  <text x="1088" y="366" text-anchor="middle" font-size="22" font-weight="800" letter-spacing="1.5" fill="#0284c7">MCP</text>

  <!-- AI assistant window -->
  <rect class="sh" x="1140" y="84" width="620" height="466" rx="26" fill="#fff" stroke="#cfe6f4" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="1170" cy="112" r="7" fill="#fca5a5"/>
  <circle cx="1192" cy="112" r="7" fill="#fcd34d"/>
  <circle cx="1214" cy="112" r="7" fill="#86efac"/>
  <text x="1450" y="120" text-anchor="middle" font-size="22" font-weight="600" fill="#55657c">Any AI assistant</text>
  <line x1="1140" y1="140" x2="1760" y2="140" stroke="#e2e8f0" stroke-width="2"/>

  <rect x="1412" y="158" width="324" height="92" rx="24" fill="#0f172a"/>
  <text x="1436" y="196" font-size="24" font-weight="500" fill="#f1f5f9">Can silicalite capture</text>
  <text x="1436" y="230" font-size="24" font-weight="500" fill="#f1f5f9">CO₂ from flue gas?</text>

  <rect x="1164" y="268" width="372" height="50" rx="25" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <use href="#i-terminal" x="1180" y="281" width="24" height="24" style="color:#0284c7"/>
  <text class="mono" x="1216" y="301" font-size="22" font-weight="600" fill="#0b1220">zeopp<tspan fill="#94a3b8"> · </tspan><tspan font-weight="500" fill="#334155">pores</tspan></text>
  <circle cx="1510" cy="293" r="15" fill="#059669"/>
  <use href="#i-check" x="1501" y="284" width="18" height="18" style="color:#fff"/>

  <rect x="1164" y="328" width="372" height="50" rx="25" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <use href="#i-terminal" x="1180" y="341" width="24" height="24" style="color:#0284c7"/>
  <text class="mono" x="1216" y="361" font-size="22" font-weight="600" fill="#0b1220">raspa3<tspan fill="#94a3b8"> · </tspan><tspan font-weight="500" fill="#334155">adsorption</tspan></text>
  <circle cx="1510" cy="353" r="15" fill="#059669"/>
  <use href="#i-check" x="1501" y="344" width="18" height="18" style="color:#fff"/>

  <rect x="1164" y="396" width="366" height="92" rx="24" fill="#e0f2fe" stroke="#bae6fd" stroke-width="2"/>
  <text x="1188" y="434" font-size="24" font-weight="500" fill="#0c2a42">Yes: <tspan font-weight="800">18×</tspan> more selective</text>
  <text x="1188" y="468" font-size="24" font-weight="500" fill="#0c2a42">for CO₂ than N₂</text>

  <rect x="1164" y="502" width="150" height="34" rx="17" fill="#ecfdf5"/>
  <use href="#i-shield" x="1176" y="508" width="22" height="22" style="color:#059669"/>
  <text x="1206" y="527" font-size="20" font-weight="700" fill="#047857">Verified</text>
  <rect x="1324" y="502" width="118" height="34" rx="17" fill="#eef0ff"/>
  <use href="#i-book" x="1336" y="508" width="22" height="22" style="color:#4f46e5"/>
  <text x="1366" y="527" font-size="20" font-weight="700" fill="#3730a3">Cited</text>
  <rect x="1452" y="502" width="196" height="34" rx="17" fill="#e6f3fb"/>
  <use href="#i-lock" x="1464" y="508" width="22" height="22" style="color:#0284c7"/>
  <text x="1494" y="527" font-size="20" font-weight="700" fill="#075985">Reproducible</text>

  <!-- apps -->
  <g font-size="22" font-weight="600" fill="#075985" text-anchor="middle">
    <rect x="1179" y="572" width="122" height="44" rx="22" fill="#fff" stroke="#cfe6f4" stroke-width="2"/>
    <text x="1240" y="602">Claude</text>
    <rect x="1313" y="572" width="112" height="44" rx="22" fill="#fff" stroke="#cfe6f4" stroke-width="2"/>
    <text x="1369" y="602">Codex</text>
    <rect x="1437" y="572" width="158" height="44" rx="22" fill="#fff" stroke="#cfe6f4" stroke-width="2"/>
    <text x="1516" y="602">Gemini CLI</text>
    <rect x="1607" y="572" width="114" height="44" rx="22" fill="#fff" stroke="#cfe6f4" stroke-width="2"/>
    <text x="1664" y="602">Cursor</text>
  </g>
</svg>
</body>
</html>
