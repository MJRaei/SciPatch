schema: 1
name: ase-emt
version: 1.0.0
title: ASE effective-medium theory (EMT)
summary: >-
  Fast, approximate energies, relaxations, and equations of state (lattice
  constant, bulk modulus) for the fcc metals Al, Cu, Ag, Au, Ni, Pd and Pt,
  using the effective-medium theory potential in ASE.
description: >-
  A lightweight example tool and a quick sanity check for workflows: results
  arrive in milliseconds, so it is ideal for teaching and for testing a
  pipeline before running expensive DFT or machine-learned potentials.
domains: [materials]
tags: [interatomic-potential, emt, relaxation, equation-of-state, lattice-constant,
       bulk-modulus, metals, alloys, ase, structure-builder]

source:
  homepage: https://wiki.fysik.dtu.dk/ase/
  paper: https://doi.org/10.1088/1361-648X/aa680e
  citation: >-
    A. H. Larsen et al., "The atomic simulation environment: a Python library for
    working with atoms", J. Phys.: Condens. Matter 29, 273002 (2017); K. W. Jacobsen,
    P. Stoltze, J. K. Nørskov, "A semi-empirical effective medium theory for metals
    and alloys", Surf. Sci. 366, 394-402 (1996).
  license: LGPL-2.1-or-later

environment:
  manager: uv
  python: "3.12"
  packages: ["ase==3.29.0"]

entrypoint: api

functions:
  build_bulk:
    outputs:
      volume_angstrom3: {unit: Å³}
  energy:
    params:
      structure: {kind: structure}
    outputs:
      energy_ev: {unit: eV}
      energy_ev_per_atom: {unit: eV/atom}
      max_force_ev_per_angstrom: {unit: eV/Å}
  relax:
    params:
      structure: {kind: structure}
      fmax: {unit: eV/Å}
    outputs:
      final_energy_ev: {unit: eV}
      relaxed_structure: {kind: structure}
  equation_of_state:
    outputs:
      lattice_constant_angstrom: {unit: Å}
      bulk_modulus_gpa: {unit: GPa}
      energy_ev_per_atom: {unit: eV/atom}

validity: >-
  EMT is a semi-empirical potential fitted to the fcc metals Al, Cu, Ag, Au, Ni,
  Pd and Pt and their alloys; other elements are rejected. It is qualitative:
  lattice constants are typically within about 1-2% of experiment, while elastic
  constants, surface and defect energies can be off by much more. Absolute
  energies are relative to EMT's own reference and are NOT comparable with DFT or
  other potentials; compare only energy differences computed with EMT. It has no
  magnetism, charge transfer, or directional bonding. Use it for teaching, quick
  checks, and testing workflows, not for publishable numbers.

maturity: established

golden:
  - name: Cu lattice constant within 1% of experiment
    function: equation_of_state
    args: {element: Cu, crystal: fcc}
    expect:
      lattice_constant_angstrom: {approx: 3.615, rel: 0.01}
    reference: >-
      Experimental room-temperature lattice constant of copper, 3.615 Å. EMT gives
      3.590 Å with this setup, 0.7% below experiment.
    against: independent
  - name: Cu equation of state matches the reference calculation
    quick: true
    function: equation_of_state
    args: {element: Cu, crystal: fcc}
    expect:
      lattice_constant_angstrom: {approx: 3.590, abs: 0.002}
      bulk_modulus_gpa: {approx: 133.6, rel: 0.01}
    reference: Regression value computed with ASE 3.29.0 EMT (deterministic).
    against: regression
  - name: a rattled Cu crystal relaxes back to the ideal-crystal energy
    function: relax
    args: {structure: tests/data/Cu_rattled.cif, fmax: 0.01}
    expect:
      converged: true
      energy_ev_per_atom: {approx: -0.005682, abs: 0.0001}
      relaxed_structure: {exists: true}
    reference: >-
      The ideal 8-atom Cu supercell at ASE's reference lattice constant has
      -0.005682 eV/atom with EMT (from 'energy').
    against: regression
  - name: elements without EMT parameters are refused
    function: equation_of_state
    args: {element: Fe, crystal: bcc}
    raises: "EMT has no reliable parameters for Fe"
    reference: >-
      EMT is parameterized only for Al, Cu, Ag, Au, Ni, Pd and Pt; iron must be
      refused rather than given a meaningless number.
