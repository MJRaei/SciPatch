schema: 1
name: chgnet
version: 0.1.0
title: CHGNet universal interatomic potential
summary: >-
  Predict energies, forces, stresses, and magnetic moments of inorganic crystals,
  relax structures, and run molecular dynamics with CHGNet, a universal
  machine-learning potential pretrained on Materials Project data.
domains: [materials]
tags: [ml-potential, universal-potential, interatomic-potential, relaxation, energy,
       forces, stress, magnetic-moment, magmom, molecular-dynamics, md, pymatgen, crystal,
       battery, stability]

source:
  repo: "https://github.com/CederGroupHub/chgnet"
  ref: "8d04abc467630b30cd8349c2fe12eeab10f62171"   # tag v0.4.2
  install: true
  paper: "https://doi.org/10.1038/s42256-023-00716-3"
  citation: >-
    B. Deng, P. Zhong, K. Jun, J. Riebesell, K. Han, C. J. Bartel, G. Ceder,
    "CHGNet as a pretrained universal neural network potential for
    charge-informed atomistic modelling", Nat. Mach. Intell. 5, 1031-1041 (2023).
  license: BSD-3-Clause (Modified BSD)
  homepage: https://chgnet.lbl.gov

environment:
  manager: uv
  python: "3.12"
  packages: []

entrypoint: api

functions:
  predict:
    params:
      structure: {kind: structure}
    outputs:
      energy_ev_per_atom: {unit: eV/atom}
      forces_ev_per_angstrom: {unit: eV/Å}
      stress_gpa: {unit: GPa}
      magmoms_mu_b: {unit: μB}
  relax:
    params:
      structure: {kind: structure}
      fmax: {unit: eV/Å}
    outputs:
      final_energy_ev: {unit: eV}
      final_energy_ev_per_atom: {unit: eV/atom}
      relaxed_structure: {kind: structure}
  molecular_dynamics:
    long_running: true
    params:
      structure: {kind: structure}
      temperature_k: {unit: K}
      timestep_fs: {unit: fs}
    outputs:
      trajectory: {kind: trajectory}

validity: >-
  The default model (0.3.0) is trained on Materials Project GGA/GGA+U (PBE)
  relaxation trajectories (MPtrj). Its energies are comparable only with
  MP-compatible PBE/PBE+U data, not with other functionals or experiments. It is
  most reliable for inorganic crystals near equilibrium; far-from-equilibrium
  configurations (high-temperature MD, defects, surfaces, molecules) are less
  accurate, and the authors recommend MatPES-trained models for MD. Magnetic
  moments are predicted, not self-consistent, and serve as a proxy for
  oxidation states. Confirm critical conclusions with DFT.

golden:
  - name: LiMnO2 energy matches the CHGNet test suite
    function: predict
    args: {structure: tests/data/mp-18767-LiMnO2.cif}
    expect:
      energy_ev_per_atom: {approx: -7.36769, abs: 0.0001}
      magmoms_mu_b.2: {approx: 3.8694, abs: 0.001}
      n_sites: 8
    reference: >-
      chgnet v0.4.2 tests/test_model.py::test_predict_structure (model 0.3.0,
      examples/mp-18767-LiMnO2.cif): energy -7.36769 eV/atom, Mn magmom 3.8694 μB.
  - name: LiMnO2 relaxation energy matches the CHGNet test suite
    function: relax
    args: {structure: tests/data/mp-18767-LiMnO2.cif}
    expect:
      final_energy_ev: {approx: -58.94209, rel: 0.0001}
      converged: true
      relaxed_structure: {exists: true}
    reference: >-
      chgnet v0.4.2 tests/test_relaxation.py::test_relaxation (default settings,
      FrechetCellFilter): final energy -58.94209 eV.
